[package]
name = "artfetch"
version = "0.2.0"
edition = "2021"
description = "Terminal art browser with Kitty graphics protocol"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
dezoomify-rs = "2"
dirs = "6"
image = "0.25"
rand = "0.10.1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
strip = true
lto = true
